
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - JobHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar">

    <a href="dashboard.html" class="logo">JobHub</a>

    <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="jobs.html">Jobs</a>
        <a href="edit-profile.html">Edit Profile</a>
        <a href="terms.html">Terms & Conditions</a>
    </div>

</nav>

<section class="page">

    <div class="container">

        <div class="page-title">
            <h1>My Profile</h1>
            <p>Your JobHub account information.</p>
        </div>

        <div class="card profile-card">

            <div class="profile-row">
                <span class="profile-label">Name</span>
                <span class="profile-value" id="name"></span>
            </div>

            <div class="profile-row">
                <span class="profile-label">Email</span>
                <span class="profile-value" id="email"></span>
            </div>

            <div class="profile-row">
                <span class="profile-label">Role</span>
                <span class="profile-value" id="role"></span>
            </div>

            <div class="profile-row">
                <span class="profile-label">Status</span>
                <span class="profile-value" id="status"></span>
            </div>

            <br>

            <a href="edit-profile.html" class="btn btn-primary">
                Edit Profile
            </a>

        </div>

    </div>

</section>

<script>

const user = JSON.parse(
    localStorage.getItem("jobhubUser") || "null"
);

if (!user) {
    window.location.href = "login.html";
}

if (user) {

    document.getElementById("name").textContent =
        user.name || "";

    document.getElementById("email").textContent =
        user.email || "";

    document.getElementById("role").textContent =
        user.role || "";

    document.getElementById("status").textContent =
        user.status || "active";
}

</script>

</body>
</html>
