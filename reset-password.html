
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password - JobHub</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>


<header class="navbar">

    <div class="logo">
        JobHub
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="jobs.html">
            Jobs
        </a>

        <a href="login.html">
            Login
        </a>

    </nav>

</header>


<main class="container">

    <section class="auth-container">

        <div class="auth-card">

            <h1>Reset Password</h1>

            <p>
                Enter the reset code you received
                and create your new password.
            </p>


            <form id="resetForm">


                <div class="form-group">

                    <label>
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Reset Code
                    </label>

                    <input
                        type="text"
                        id="code"
                        placeholder="Enter 6-digit code"
                        maxlength="6"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        New Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter new password"
                        minlength="6"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm new password"
                        minlength="6"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn"
                >
                    Change Password
                </button>


            </form>


            <div id="message"></div>


            <p style="margin-top:20px;">

                <a href="forgot-password.html">
                    Request another code
                </a>

            </p>

        </div>

    </section>

</main>


<script>

const API_URL =
    "http://localhost:5000";


const emailInput =
    document.getElementById("email");


const savedEmail =
    localStorage.getItem(
        "jobhubResetEmail"
    );


if (savedEmail) {

    emailInput.value =
        savedEmail;

}


document
    .getElementById("resetForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const email =
                emailInput.value.trim();

            const code =
                document
                    .getElementById("code")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("password")
                    .value;

            const confirmPassword =
                document
                    .getElementById(
                        "confirmPassword"
                    )
                    .value;

            const message =
                document.getElementById(
                    "message"
                );


            if (
                password !==
                confirmPassword
            ) {

                message.textContent =
                    "Passwords do not match.";

                message.className =
                    "error";

                return;

            }


            try {

                const response =
                    await fetch(
                        `${API_URL}/api/reset-password`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                email,
                                code,
                                newPassword:
                                    password
                            })
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Password reset failed."
                    );

                }


                message.textContent =
                    "Password changed successfully. You can now log in.";

                message.className =
                    "success";


                localStorage.removeItem(
                    "jobhubResetEmail"
                );


                setTimeout(function() {

                    window.location.href =
                        "login.html";

                }, 2000);


            } catch (error) {

                message.textContent =
                    error.message;

                message.className =
                    "error";

            }

        }
    );

</script>

</body>
</html>
